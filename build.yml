name: 编译 iOS App (TrollStore 自签)

# 网页套壳版：直接加载 https://736918.top，业务功能全在网页版。
# 扁平结构：仓库根目录直接放 .swift / Info.plist / AppIcon.png，
# 编译时自动生成 AppIcon 资源目录，无需网页端上传文件夹。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 与 ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: 生成 AppIcon 资源目录（全尺寸，修复 TrollStore 图标空白）
        run: |
          set -e
          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets/AppIcon.appiconset
          # 根目录 Contents.json 必须存在，否则 actool 可能整包跳过资源目录
          cat > Assets.xcassets/Contents.json <<'EOF'
          { "info": { "author": "xcode", "version": 1 } }
          EOF
          cd Assets.xcassets/AppIcon.appiconset
          # 用源图裁出各尺寸，保证真机图标不空白
          sips -z 40 40   ../../AppIcon.png --out Icon-20@2x.png     >/dev/null
          sips -z 60 60   ../../AppIcon.png --out Icon-20@3x.png     >/dev/null
          sips -z 58 58   ../../AppIcon.png --out Icon-29@2x.png     >/dev/null
          sips -z 87 87   ../../AppIcon.png --out Icon-29@3x.png     >/dev/null
          sips -z 80 80   ../../AppIcon.png --out Icon-40@2x.png     >/dev/null
          sips -z 120 120 ../../AppIcon.png --out Icon-40@3x.png     >/dev/null
          sips -z 120 120 ../../AppIcon.png --out Icon-60@2x.png     >/dev/null
          sips -z 180 180 ../../AppIcon.png --out Icon-60@3x.png     >/dev/null
          sips -z 20 20   ../../AppIcon.png --out Icon-ipad-20.png   >/dev/null
          sips -z 40 40   ../../AppIcon.png --out Icon-ipad-20@2x.png >/dev/null
          sips -z 29 29   ../../AppIcon.png --out Icon-ipad-29.png   >/dev/null
          sips -z 58 58   ../../AppIcon.png --out Icon-ipad-29@2x.png >/dev/null
          sips -z 40 40   ../../AppIcon.png --out Icon-ipad-40.png   >/dev/null
          sips -z 80 80   ../../AppIcon.png --out Icon-ipad-40@2x.png >/dev/null
          sips -z 76 76   ../../AppIcon.png --out Icon-ipad-76.png   >/dev/null
          sips -z 152 152 ../../AppIcon.png --out Icon-ipad-76@2x.png >/dev/null
          sips -z 167 167 ../../AppIcon.png --out Icon-ipad-83@2x.png >/dev/null
          cp ../../AppIcon.png Icon-1024.png
          cat > Contents.json <<'EOF'
          {
            "images": [
              {"filename":"Icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"Icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"Icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"Icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"Icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"Icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"Icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"Icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"Icon-ipad-20.png","idiom":"ipad","scale":"1x","size":"20x20"},
              {"filename":"Icon-ipad-20@2x.png","idiom":"ipad","scale":"2x","size":"20x20"},
              {"filename":"Icon-ipad-29.png","idiom":"ipad","scale":"1x","size":"29x29"},
              {"filename":"Icon-ipad-29@2x.png","idiom":"ipad","scale":"2x","size":"29x29"},
              {"filename":"Icon-ipad-40.png","idiom":"ipad","scale":"1x","size":"40x40"},
              {"filename":"Icon-ipad-40@2x.png","idiom":"ipad","scale":"2x","size":"40x40"},
              {"filename":"Icon-ipad-76.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"Icon-ipad-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"Icon-ipad-83@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"Icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          cd ../..
          ls -la Assets.xcassets/AppIcon.appiconset

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project Meizhuang.xcodeproj \
            -scheme Meizhuang \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER=com.zhengyongfu.meizhuang2 \
            clean build

      - name: 假签名并打包 IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Meizhuang.app"
          if [ ! -d "$APP" ]; then
            echo "编译产物不存在：$APP"
            find build -maxdepth 5 -name "*.app" -print
            exit 1
          fi
          if [ -f "$APP/Meizhuang" ]; then
            ldid -S "$APP/Meizhuang"
          fi
          # ===== 图标双保险：TrollStore 假签名安装不认 Asset Catalog，必须放传统图标文件 =====
          # 1) 把各尺寸图标直接塞进 .app 根目录（传统 CFBundleIconFiles 方式）
          cp AppIcon.png "$APP/AppIcon.png"
          sips -z 60 60   AppIcon.png --out "$APP/Icon-60.png"    >/dev/null
          sips -z 120 120 AppIcon.png --out "$APP/Icon-60@2x.png"  >/dev/null
          sips -z 180 180 AppIcon.png --out "$APP/Icon-60@3x.png"  >/dev/null
          sips -z 76 76   AppIcon.png --out "$APP/Icon-76.png"     >/dev/null
          sips -z 152 152 AppIcon.png --out "$APP/Icon-76@2x.png"  >/dev/null
          sips -z 1024 1024 AppIcon.png --out "$APP/Icon-1024.png" >/dev/null
          # 2) 强制改写包内 Info.plist，用传统图标声明（不依赖仓库里的 Info.plist 是否已更新）
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon.png" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$APP/Info.plist"
          for f in Icon-60@2x.png Icon-60@3x.png Icon-76@2x.png Icon-1024.png AppIcon.png; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles: string $f" "$APP/Info.plist"
          done
          echo "===== 包内图标文件核对 ====="
          ls -la "$APP"/*.png
          echo "----- 包内 Info.plist 图标声明 -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFiles" "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -i icon || true
          mkdir -p Payload
          cp -R "$APP" Payload/Meizhuang.app
          zip -qry Meizhuang.ipa Payload
          shasum -a 256 Meizhuang.ipa
          ls -lh Meizhuang.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: meizhuang-ios
          path: Meizhuang.ipa
          retention-days: 90
