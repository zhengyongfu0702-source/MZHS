name: Meizhuang

options:
  bundleIdPrefix: com.zhengyongfu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  PRODUCT_BUNDLE_IDENTIFIER: com.zhengyongfu.meizhuang
  MARKETING_VERSION: "3.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  SUPPORTED_PLATFORMS: iphoneos
  SDKROOT: iphoneos
  CLANG_ENABLE_MODULES: YES
  CLANG_ENABLE_OBJC_ARC: YES
  SWIFT_VERSION: "5.0"

targets:
  Meizhuang:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".github"
          - "Assets.xcassets"
          - "AppIcon.png"
          - "Info.plist"
          - "README.md"
          - "project.yml"
          - "build.yml"
          - "build-yml-内容.txt"
          - "build"
    resources:
      - path: Assets.xcassets
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_NAME: Meizhuang
      PRODUCT_BUNDLE_IDENTIFIER: com.zhengyongfu.meizhuang
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
